name: Build TriPhotos

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: >-
          xcodebuild build
          -project TriPhotos.xcodeproj
          -scheme TriPhotos
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          SWIFT_VERSION=5.0

      - name: Validate generated app metadata
        shell: bash
        run: |
          set -euo pipefail
          plist="build/DerivedData/Build/Products/Debug-iphoneos/TriPhotos.app/Info.plist"
          test -f "$plist"
          plutil -extract CFBundleIdentifier raw -o - "$plist" | grep -Fxq "com.moncompte.triphotos"
          plutil -extract MinimumOSVersion raw -o - "$plist" | grep -Fxq "17.0"
          plutil -p "$plist" | grep -Fq "UIInterfaceOrientationPortrait"
          plutil -p "$plist" | grep -Fq "NSPhotoLibraryUsageDescription"
          plutil -p "$plist" | grep -Fq "NSPhotoLibraryAddUsageDescription"
          echo "Generated Info.plist checks passed."

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          app_path="build/DerivedData/Build/Products/Debug-iphoneos/TriPhotos.app"
          test -d "$app_path"
          rm -rf build/Payload build/TriPhotos.ipa
          mkdir -p build/Payload
          cp -R "$app_path" build/Payload/TriPhotos.app
          (cd build && zip -qry TriPhotos.ipa Payload)

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: TriPhotos-ipa
          path: build/TriPhotos.ipa
          if-no-files-found: error
